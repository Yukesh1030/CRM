<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - STACKLY CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=2">
  <style>
    body {
      background: var(--bg-offwhite);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .back-btn {
      position: absolute;
      top: 30px;
      left: 30px;
      font-weight: 500;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: var(--transition);
    }
    .back-btn:hover {
      color: var(--primary-hover);
    }
    .auth-container {
      background: var(--secondary);
      width: 100%;
      max-width: 450px;
      padding: 50px 40px;
      border-radius: 12px;
      box-shadow: var(--shadow-xl);
      text-align: center;
      opacity: 0; /* For GSAP */
    }
    .auth-brand {
      margin-bottom: 30px;
    }
    .auth-brand img {
      height: 40px;
      margin: 0 auto;
    }
    .auth-title {
      margin-bottom: 10px;
    }
    .auth-subtitle {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 0.9rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: inherit;
      transition: var(--transition);
      background: var(--bg-offwhite);
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--secondary);
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.8rem;
      margin-top: 5px;
      display: none;
    }
    .forgot-pwd {
      text-align: right;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
    .forgot-pwd a {
      color: var(--text-muted);
      transition: var(--transition);
    }
    .forgot-pwd a:hover {
      color: var(--accent);
    }
    .auth-footer {
      margin-top: 30px;
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: var(--text-dark);
      font-weight: 600;
      transition: var(--transition);
    }
    .auth-footer a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

  <div class="auth-container gs-auth">
    <div class="auth-brand">
      <img src="assets/Brand-logo.webp" alt="STACKLY">
    </div>
    
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Login to access your STACKLY account</p>

    <form id="loginForm" novalidate>
      <div class="form-group gs-item">
        <label for="loginAs">Login As</label>
        <select id="loginAs">
          <option value="Admin">Admin</option>
          <option value="Client">Client</option>
        </select>
      </div>

      <div class="form-group gs-item">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="admin@stackly.com">
        <div class="error-msg" id="emailError">Please enter a valid email</div>
      </div>

      <div class="form-group gs-item">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <div class="error-msg" id="pwdError">Please enter your password</div>
      </div>

      <div class="forgot-pwd gs-item">
        <a href="404.html">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary gs-item" style="width: 100%; border: none;">Login <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i></button>
    </form>
    
    <div style="background: rgba(0,0,0,0.02); border: 1px dashed var(--border-color); padding: 15px; border-radius: 8px; margin-top: 20px; text-align: left; font-size: 0.8rem; color: var(--text-muted);" class="gs-item">
      Sample Credentials<br>
      Email: admin@stackly.com<br>
      Password: admin123
    </div>

    <div class="auth-footer gs-item">
      Don't have an account? <a href="Signup.html">Sign up</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // GSAP Entrance
      const tl = gsap.timeline();
      tl.to('.gs-auth', { opacity: 1, duration: 0.2 })
        .from('.gs-auth', { y: 50, duration: 0.8, ease: "power3.out" })
        .from('.gs-item', { y: 20, opacity: 0, stagger: 0.1, duration: 0.5, ease: "power2.out" }, "-=0.4");

      // Validation
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let isValid = true;
        const email = document.getElementById('email').value.trim();
        const pwd = document.getElementById('password').value.trim();
        const role = document.getElementById('loginAs').value;
        
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          document.getElementById('emailError').style.display = 'block';
          isValid = false;
        } else {
          document.getElementById('emailError').style.display = 'none';
        }

        if (pwd === '') {
          document.getElementById('pwdError').style.display = 'block';
          isValid = false;
        } else {
          document.getElementById('pwdError').style.display = 'none';
        }
        
        if (isValid) {
          // Redirect based on role
          if (role === 'Admin') {
            window.location.href = 'AdminDashboard.html';
          } else {
            window.location.href = 'ClientDashboard.html';
          }
        }
      });
    });
  </script>
</body>
</html>
