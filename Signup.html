<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - STACKLY CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=2">
  <style>
    body {
      background: var(--bg-offwhite);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 40px 0;
    }
    .back-btn {
      position: absolute;
      top: 30px;
      left: 30px;
      font-weight: 500;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: var(--transition);
    }
    .back-btn:hover {
      color: var(--primary-hover);
    }
    .auth-container {
      background: var(--secondary);
      width: 100%;
      max-width: 450px;
      padding: 50px 40px;
      border-radius: 12px;
      box-shadow: var(--shadow-xl);
      text-align: center;
      opacity: 0;
    }
    .auth-brand {
      margin-bottom: 30px;
    }
    .auth-brand img {
      height: 40px;
      margin: 0 auto;
    }
    .auth-title {
      margin-bottom: 10px;
    }
    .auth-subtitle {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 0.9rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: inherit;
      transition: var(--transition);
      background: var(--bg-offwhite);
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--secondary);
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.8rem;
      margin-top: 5px;
      display: none;
    }
    .terms {
      display: flex;
      gap: 10px;
      text-align: left;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      align-items: flex-start;
    }
    .terms input {
      margin-top: 4px;
    }
    .terms a {
      color: var(--text-dark);
      font-weight: 500;
    }
    .auth-footer {
      margin-top: 30px;
      font-size: 0.9rem;
    }
    .auth-footer a {
      color: var(--text-dark);
      font-weight: 600;
      transition: var(--transition);
    }
    .auth-footer a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

  <div class="auth-container gs-auth">
    <div class="auth-brand">
      <img src="assets/Brand-logo.webp" alt="STACKLY">
    </div>
    
    <h2 class="auth-title">Create Account</h2>
    <p class="auth-subtitle">Join thousands of teams growing with STACKLY</p>

    <form id="signupForm" novalidate>
      <div class="form-group gs-item">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="John Doe">
        <div class="error-msg" id="nameError">Please enter your full name</div>
      </div>

      <div class="form-group gs-item">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@company.com">
        <div class="error-msg" id="emailError">Please enter a valid email</div>
      </div>

      <div class="form-group gs-item">
        <label for="signupAs">Sign Up As</label>
        <select id="signupAs">
          <option value="Admin">Admin</option>
          <option value="Client">Client</option>
        </select>
      </div>

      <div class="form-group gs-item">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <div class="error-msg" id="pwdError">Password must be at least 6 characters</div>
      </div>

      <div class="terms gs-item">
        <input type="checkbox" id="termsCheck">
        <label for="termsCheck" style="font-weight: 400;">I agree to the <a href="404.html">Terms of Service</a> and <a href="404.html">Privacy Policy</a></label>
      </div>
      <div class="error-msg gs-item" id="termsError" style="text-align: left; margin-top: -15px; margin-bottom: 15px;">You must agree to the terms</div>

      <button type="submit" class="btn btn-primary" style="display: block !important; visibility: visible !important; opacity: 1 !important; width: 100% !important; min-height: 50px !important; background-color: #0f172a !important; color: #ffffff !important; border: none !important; border-radius: 50px !important; margin-top: 10px !important; z-index: 9999 !important;">Create Account</button>
    </form>

    <div class="auth-footer gs-item">
      Already have an account? <a href="Login.html">Login</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // GSAP Entrance
      const tl = gsap.timeline();
      tl.to('.gs-auth', { opacity: 1, duration: 0.2 })
        .from('.gs-auth', { y: 50, duration: 0.8, ease: "power3.out" })
        .from('.gs-item', { y: 20, opacity: 0, stagger: 0.08, duration: 0.5, ease: "power2.out" }, "-=0.4");

      // Validation
      document.getElementById('signupForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let isValid = true;
        const name = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const pwd = document.getElementById('password').value.trim();
        const terms = document.getElementById('termsCheck').checked;
        
        if (name === '') {
          document.getElementById('nameError').style.display = 'block';
          isValid = false;
        } else {
          document.getElementById('nameError').style.display = 'none';
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          document.getElementById('emailError').style.display = 'block';
          isValid = false;
        } else {
          document.getElementById('emailError').style.display = 'none';
        }

        if (pwd.length < 6) {
          document.getElementById('pwdError').style.display = 'block';
          isValid = false;
        } else {
          document.getElementById('pwdError').style.display = 'none';
        }

        if (!terms) {
          document.getElementById('termsError').style.display = 'block';
          isValid = false;
        } else {
          document.getElementById('termsError').style.display = 'none';
        }
        
        if (isValid) {
          // Store dummy flag to show success on login
          window.location.href = 'Login.html';
        }
      });
    });
  </script>
</body>
</html>
