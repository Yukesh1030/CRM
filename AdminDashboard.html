<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - STACKLY CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--bg-offwhite); display: flex; height: 100vh; overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 260px; background: var(--bg-dark); color: var(--secondary); display: flex; flex-direction: column; transition: var(--transition); }
    .sidebar-header { padding: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-header img { height: 30px; filter: brightness(0) invert(1); }
    .sidebar-menu { flex: 1; padding: 20px 0; overflow-y: auto; }
    .sidebar-link { display: flex; align-items: center; gap: 15px; padding: 12px 24px; color: #94a3b8; transition: var(--transition); }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,0.05); color: var(--accent); border-left: 3px solid var(--accent); }
    
    /* Main Content */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header */
    .top-header { background: var(--secondary); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); z-index: 10; }
    .search-box { position: relative; width: 300px; }
    .search-box input { width: 100%; padding: 10px 15px 10px 40px; border-radius: 50px; border: 1px solid var(--border-color); font-family: inherit; }
    .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .user-profile { display: flex; align-items: center; gap: 15px; }
    .user-avatar { width: 40px; height: 40px; background: var(--primary); color: var(--text-dark); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; }
    
    /* Dashboard Area */
    .dashboard-area { flex: 1; padding: 30px; overflow-y: auto; }
    
    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; margin-bottom: 30px; }
    .stat-card { background: var(--secondary); padding: 24px; border-radius: 12px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 20px; }
    .stat-icon { width: 50px; height: 50px; border-radius: 12px; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    .stat-info h3 { font-size: 1.8rem; margin: 0; color: var(--text-dark); }
    .stat-info p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }
    
    /* Email / Task List Section */
    .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    .panel { background: var(--secondary); border-radius: 12px; box-shadow: var(--shadow-sm); padding: 24px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .panel-header h3 { margin: 0; }
    
    .email-list { display: flex; flex-direction: column; gap: 15px; }
    .email-item { display: flex; align-items: flex-start; gap: 15px; padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; transition: var(--transition); cursor: pointer; }
    .email-item:hover { border-color: var(--accent); transform: translateX(5px); }
    .email-avatar { width: 40px; height: 40px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; }
    .email-content h4 { margin: 0 0 5px; font-size: 1rem; }
    .email-content p { margin: 0; font-size: 0.85rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .email-time { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; margin-left: auto; }
    
    .mobile-toggle { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    
    @media (max-width: 991px) {
      .content-grid { grid-template-columns: 1fr; }
      .sidebar { position: fixed; left: -260px; height: 100vh; z-index: 100; box-shadow: var(--shadow-xl); }
      .sidebar.active { left: 0; }
      .mobile-toggle { display: block; padding: 8px; margin-left: -8px; }
    }
    @media (max-width: 576px) {
      .search-box { display: none; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="index.html" style="display: block; width: 100%;"><img src="assets/Brand-logo.webp" alt="STACKLY"></a>
    </div>
    <div class="sidebar-menu">
      <a href="AdminDashboard.html" class="sidebar-link active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
      <a href="AdminLeads.html" class="sidebar-link"><i class="fa-solid fa-users"></i> Leads & Contacts</a>
      <a href="AdminCommunications.html" class="sidebar-link"><i class="fa-solid fa-envelope"></i> Communications</a>
      <a href="AdminPipeline.html" class="sidebar-link"><i class="fa-solid fa-chart-line"></i> Sales Pipeline</a>
      <a href="AdminMarketing.html" class="sidebar-link"><i class="fa-solid fa-bullhorn"></i> Marketing</a>
      <a href="AdminSettings.html" class="sidebar-link"><i class="fa-solid fa-gear"></i> Settings</a>
    </div>
    <div style="padding: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
      <a href="Login.html" class="sidebar-link" style="padding: 0;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-header">
      <div class="d-flex align-center gap-3">
        <button class="mobile-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search leads, tasks...">
        </div>
      </div>
      <div class="user-profile">
        <i class="fa-regular fa-bell" style="font-size: 1.2rem; cursor: pointer;"></i>
        <div class="user-avatar" id="userAvatarText">A</div>
        <div style="font-weight: 500;" id="userNameText">Admin</div>
      </div>
    </header>

    <div class="dashboard-area gs-dash">
      <div class="stats-grid">
        <div class="stat-card gs-item">
          <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
          <div class="stat-info">
            <p>Total Leads</p>
            <h3 class="gs-counter" data-val="1420">0</h3>
          </div>
        </div>
        <div class="stat-card gs-item">
          <div class="stat-icon" style="background: var(--primary-light); color: var(--primary-hover);"><i class="fa-solid fa-sack-dollar"></i></div>
          <div class="stat-info">
            <p>Revenue (MTD)</p>
            <h3 class="gs-counter" data-val="45">0</h3>
          </div>
        </div>
        <div class="stat-card gs-item">
          <div class="stat-icon" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6;"><i class="fa-solid fa-chart-line"></i></div>
          <div class="stat-info">
            <p>Conversion Rate</p>
            <h3 class="gs-counter" data-val="24">0</h3>
          </div>
        </div>
        <div class="stat-card gs-item">
          <div class="stat-icon" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;"><i class="fa-solid fa-list-check"></i></div>
          <div class="stat-info">
            <p>Pending Tasks</p>
            <h3 class="gs-counter" data-val="18">0</h3>
          </div>
        </div>
      </div>

      <div class="content-grid">
        <!-- Dynamic Emails / Communications -->
        <div class="panel gs-item">
          <div class="panel-header">
            <h3>Recent Communications</h3>
            <button class="btn btn-outline" style="padding: 5px 15px; font-size: 0.8rem;">View All</button>
          </div>
          <div class="email-list" id="emailList">
            <!-- Dynamic Content Injected via JS -->
          </div>
        </div>

        <!-- Quick Actions / Mini Chart -->
        <div class="panel gs-item">
          <div class="panel-header">
            <h3>Quick Actions</h3>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;">
            <button class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 0.9rem;"><i class="fa-solid fa-plus" style="margin-right: 5px;"></i> New Lead</button>
            <button class="btn btn-outline" style="width: 100%; padding: 10px; font-size: 0.9rem;"><i class="fa-solid fa-envelope" style="margin-right: 5px;"></i> Send Email</button>
          </div>
          
          <div class="panel-header">
            <h3>Lead Sources</h3>
          </div>
          <div style="height: 200px; display: flex; align-items: flex-end; gap: 20px; padding-top: 20px; border-bottom: 1px solid var(--border-color);">
            <div style="flex: 1; background: var(--accent); height: 80%; border-radius: 4px 4px 0 0; position: relative;"><span style="position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 0.8rem;">Organic</span></div>
            <div style="flex: 1; background: var(--primary); height: 60%; border-radius: 4px 4px 0 0; position: relative;"><span style="position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 0.8rem;">Social</span></div>
            <div style="flex: 1; background: #3b82f6; height: 40%; border-radius: 4px 4px 0 0; position: relative;"><span style="position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 0.8rem;">Direct</span></div>
            <div style="flex: 1; background: #ef4444; height: 90%; border-radius: 4px 4px 0 0; position: relative;"><span style="position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 0.8rem;">Paid</span></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Sidebar Toggle
      const sidebarToggle = document.getElementById('sidebarToggle');
      const sidebar = document.getElementById('sidebar');
      if (sidebarToggle) {
        sidebarToggle.addEventListener('click', () => {
          sidebar.classList.toggle('active');
        });
      }

      // Dynamic Emails Array
      const emails = [
        { name: 'Sarah Jenkins', avatar: 'S', subject: 'Proposal Review', preview: 'Hi team, I reviewed the latest proposal and I have a few questions regarding the pricing model for the enterprise tier.', time: '10:42 AM' },
        { name: 'Michael Chen', avatar: 'M', subject: 'New Lead: TechCorp', preview: 'We just got a new inquiry from TechCorp. They are looking to implement a CRM solution within the next 30 days.', time: '09:15 AM' },
        { name: 'Emma Watson', avatar: 'E', subject: 'Follow up required', preview: 'Just a reminder to follow up with DesignStudio regarding their contract renewal.', time: 'Yesterday' },
        { name: 'David Smith', avatar: 'D', subject: 'Demo Request', preview: 'I would like to schedule a demo of your platform for my marketing team next week.', time: 'Yesterday' }
      ];

      const emailList = document.getElementById('emailList');
      
      emails.forEach(email => {
        const item = document.createElement('div');
        item.className = 'email-item gs-email';
        item.innerHTML = `
          <div class="email-avatar">${email.avatar}</div>
          <div class="email-content">
            <h4>${email.name} <span style="font-weight: 400; font-size: 0.85rem; color: var(--accent);">• ${email.subject}</span></h4>
            <p>${email.preview}</p>
          </div>
          <div class="email-time">${email.time}</div>
        `;
        emailList.appendChild(item);
      });

      // GSAP Animations
      gsap.from('.gs-item', { y: 20, opacity: 0, stagger: 0.1, duration: 0.6, ease: "power2.out" });
      gsap.from('.gs-email', { x: -20, opacity: 0, stagger: 0.1, duration: 0.5, ease: "power2.out", delay: 0.3 });

      // Number Counters
      const counters = document.querySelectorAll('.gs-counter');
      counters.forEach(counter => {
        const target = parseInt(counter.getAttribute('data-val'));
        gsap.to(counter, {
          innerHTML: target,
          duration: 1.5,
          snap: { innerHTML: 1 },
          onUpdate: function() {
            let val = Math.round(this.targets()[0].innerHTML);
            if (target === 45) { counter.innerHTML = '$' + val + 'K'; }
            else if (target === 24) { counter.innerHTML = val + '%'; }
            else { counter.innerHTML = val; }
          }
        });
      });

      // Load dynamic username
      const storedName = localStorage.getItem('crm_username');
      if (storedName) {
        document.getElementById('userNameText').textContent = storedName;
        document.getElementById('userAvatarText').textContent = storedName.charAt(0).toUpperCase();
      }
    });
  </script>
<script>document.addEventListener('DOMContentLoaded', () => {
      // Hijack Links and Forms for Demo
      document.querySelectorAll('a').forEach(link => {
        if (!link.closest('.sidebar') && !link.closest('.sidebar-menu')) {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = '404.html';
          });
        }
      });
      document.querySelectorAll('button').forEach(btn => {
         if(!btn.closest('.sidebar') && !btn.closest('form') && !btn.closest('.mobile-toggle') && !btn.closest('.chat-input') && !btn.closest('.action-btns')) {
             btn.addEventListener('click', (e) => {
                 e.preventDefault();
                 window.location.href = '404.html';
             });
         }
      });
      document.querySelectorAll('form').forEach(form => {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          let isValid = true;
          form.querySelectorAll('input, select').forEach(input => {
            if (input.required && !input.value.trim()) {
              isValid = false;
              input.style.borderColor = 'red';
            } else {
              input.style.borderColor = '';
            }
          });
          if (isValid) {
            window.location.href = '404.html';
          } else {
            alert('Please fill out all required fields.');
          }
        });
      });
});</script>
</body>
</html>
